    return best;
  }

  function show(idx) {
    chart.data.datasets[0].pointRadius = radii(idx);
    hoverState.idx = idx;
    chart.update('none');

    tooltipEl.innerHTML =
      '<div style="font-weight:600;margin-bottom:4px;">' + labels[idx] + '</div>' +
      '<div><span style="color:' + COLOR + ';">&#9679;</span> USD 1 = BOB: ' + sigFig(bob[idx], 4) + '</div>';

    var canvasRect = ctx.canvas.getBoundingClientRect();
    var wrapRect = wrap.getBoundingClientRect();
    var offsetX = canvasRect.left - wrapRect.left;
    var offsetY = canvasRect.top - wrapRect.top;
    var xPix = chart.scales.x.getPixelForValue(idx);
    var yPix = chart.scales.y.getPixelForValue(bob[idx]);

    var left = offsetX + xPix + 14;
    if (left + 200 > wrapRect.width) left = offsetX + xPix - 214;
    var top = Math.max(0, offsetY + yPix - 44);
    tooltipEl.style.display = 'block';
    tooltipEl.style.left = left + 'px';
    tooltipEl.style.top = top + 'px';
  }

  function hide() {
    chart.data.datasets[0].pointRadius = radii(null);
    hoverState.idx = null;
    chart.update('none');
    tooltipEl.style.display = 'none';
  }

  ctx.canvas.addEventListener('mousemove', function (evt) {
    var rect = ctx.canvas.getBoundingClientRect();
    var x = evt.clientX - rect.left;
    var y = evt.clientY - rect.top;
    var area = chart.chartArea;
    if (x < area.left || x > area.right || y < area.top || y > area.bottom) { hide(); return; }
    show(nearestIndex(x));
  });
  ctx.canvas.addEventListener('mouseleave', hide);
})();
</script>
</body>
</html>
